version: 2

project_name: devlog

builds:
  - main: ./cmd/devlog
    binary: devlog
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - name_template: devlog_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: devlog_{{ .Version }}_checksums.txt

release:
  draft: false